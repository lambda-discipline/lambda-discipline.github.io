# Settings for the tools that check the build scripts. The site itself is
# built with `python build.py`; it isn't a package.

[project]
name = "lambda-discipline-website"
version = "0"
requires-python = ">=3.11"

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".cache", "_site"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle and pyflakes
    "I",            # import order
    "UP",           # modern syntax
    "B",            # likely bugs
    "SIM",          # simplifications
    "RUF",          # ruff's own rules
]
ignore = [
    "E501",         # black decides line length
]

[tool.mypy]
files = ["build.py", "lbd_lexer.py"]
python_version = "3.11"
strict = true
# Some ignores in the scripts are for editors' type checkers, not mypy.
warn_unused_ignores = false
